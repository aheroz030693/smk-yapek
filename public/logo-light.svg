<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 140" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Emblem Badge -->
  <g transform="translate(15, 10)">
    <!-- Badge Outer Shield (Yellow/Amber Border) -->
    <path d="M 60 5 C 92 5, 115 28, 115 60 C 115 88, 85 110, 60 120 C 35 110, 5 88, 5 60 C 5 28, 28 5, 60 5 Z" 
          fill="#0F4374" stroke="#EA8B00" stroke-width="8" stroke-linejoin="round" />
    
    <!-- Inner White Circle Ring -->
    <circle cx="60" cy="58" r="32" fill="none" stroke="#FFFFFF" stroke-width="5" />
    
    <!-- Golden Sun & Wave inside -->
    <g clip-path="url(#circleClip)">
      <circle cx="60" cy="58" r="28" fill="#0F4374" />
      <!-- Golden Sun Core -->
      <circle cx="60" cy="54" r="18" fill="#EA8B00" />
      <!-- White Wave Horizon -->
      <path d="M 32 64 C 44 58, 54 68, 60 62 C 66 56, 76 68, 88 64 L 88 88 L 32 88 Z" fill="#FFFFFF" />
    </g>
    <clipPath id="circleClip">
      <circle cx="60" cy="58" r="28" />
    </clipPath>
  </g>

  <!-- Typography -->
  <g transform="translate(150, 45)">
    <!-- Main Title -->
    <text x="0" y="0" font-family="'Outfit', 'Plus Jakarta Sans', Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="1">
      <tspan fill="#0F4374">SMK YAPEK</tspan>
      <tspan fill="#EA8B00" dx="10">GOMBONG</tspan>
    </text>
    
    <!-- Subtitle 1 -->
    <text x="2" y="28" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14.5" font-weight="800" fill="#4B637B" letter-spacing="2.8">
      LEMBAGA PENDIDIKAN KEJURUAN BERKUALITAS
    </text>
    
    <!-- Subtitle 2 -->
    <text x="2" y="48" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" font-weight="600" fill="#788B9E" letter-spacing="1.5">
      KABUPATEN KEBUMEN • JAWA TENGAH
    </text>
  </g>
</svg>
